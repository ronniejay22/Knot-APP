name: Knot
options:
  bundleIdPrefix: com.knot
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.2"
  generateEmptyDirectories: true
  groupSortPosition: top

packages:
  LucideIcons:
    url: https://github.com/JakubMazur/lucide-icons-swift.git
    from: "0.563.1"
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: "8.0.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    INFOPLIST_FILE: Knot/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.ronniejay.knot
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: VN5G3R8J23
    CODE_SIGN_STYLE: Automatic

targets:
  Knot:
    type: application
    platform: iOS
    sources:
      - path: Knot
        excludes:
          - "**/.DS_Store"
          # The StoreKit catalog is a debug/test artifact driven by the run
          # scheme's `storeKitConfiguration` (and bundled into KnotTests for
          # SKTestSession) — keep it out of the shipped app bundle.
          - "**/*.storekit"
    entitlements:
      path: Knot/Knot.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: development
        com.apple.developer.associated-domains:
          - applinks:api.knot-app.com
          - applinks:api.knot-app.com?mode=developer
    settings:
      base:
        INFOPLIST_FILE: Knot/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ronniejay.knot
        SWIFT_EMIT_LOC_STRINGS: true
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Knot/Knot.entitlements
    dependencies:
      - package: LucideIcons
      - package: Supabase
        product: Auth
      - package: Supabase
        product: PostgREST
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
    preBuildScripts: []
    postBuildScripts:
      # Inject the Mac's current LAN IP into the DEBUG Info.plist so the
      # simulator AND a physical device reach the local backend with no manual
      # edits. No-op for Release. See iOS/scripts/inject-dev-host.sh.
      - script: '"${SRCROOT}/scripts/inject-dev-host.sh"'
        name: "Inject Dev API Host (Debug)"
        # Always run: the output depends on the current Wi-Fi IP, not on any
        # input file, so dependency-analysis up-to-date skipping would bake a
        # stale IP after a network change. outputFiles stays declared so the
        # sandbox permits the DevServer.plist write.
        basedOnDependencyAnalysis: false
        inputFiles:
          - "${SRCROOT}/scripts/inject-dev-host.sh"
        outputFiles:
          - "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/DevServer.plist"

  KnotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KnotTests
        excludes:
          - "**/.DS_Store"
      # Bundle the StoreKit catalog into the test bundle so
      # SubscriptionManagerTests can spin up an SKTestSession from it.
      - path: Knot/Knot.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ronniejay.knot.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Knot.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Knot"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # StoreKitTest is a developer framework (like XCTest). Enable the testing
        # search paths and weak-link it so SubscriptionManagerTests' SKTestSession
        # resolves at build/run time.
        ENABLE_TESTING_SEARCH_PATHS: true
        OTHER_LDFLAGS: -weak_framework StoreKitTest
    dependencies:
      - target: Knot

  KnotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KnotUITests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ronniejay.knot.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Knot
    dependencies:
      - target: Knot

schemes:
  Knot:
    build:
      targets:
        Knot: all
        KnotTests: [test]
        KnotUITests: [test]
    run:
      config: Debug
      # Drives StoreKit purchases/trials against the local product catalog in the
      # simulator (see Knot/Knot.storekit) so the onboarding paywall's 7-day free
      # trial can be exercised without App Store Connect. No effect on Release.
      storeKitConfiguration: Knot/Knot.storekit
    test:
      config: Debug
      targets:
        - KnotTests
        - KnotUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
